<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrams-for-agents-title diagrams-for-agents-desc" viewBox="0 0 1200 700" width="1200" height="700" data-diagrams-for-agents-family="flow">
  <title id="diagrams-for-agents-title">Evidence-first recommendation</title>
