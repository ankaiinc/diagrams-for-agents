    <text x="374.65" y="317.8" text-anchor="start" style="font-size:12px" font-weight="450" fill="#5f6470"><tspan x="374.65" dy="0">Match the reader&apos;s</tspan><tspan x="374.65" dy="15">decision</tspan></text>
