<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrams-for-agents-title diagrams-for-agents-desc" viewBox="0 0 1200 700" width="1200" height="700" data-diagrams-for-agents-family="flow">
  <title id="diagrams-for-agents-title">Evidence-first recommendation</title>
  <desc id="diagrams-for-agents-desc">A small operating loop for high-stakes advice</desc>
  <style>
    :root{--paper:#ffffff;--paper-2:#f4f6f5;--ink:#0b0b12;--muted:#5f6470;--accent:#10b4ab;--accent-2:#f5d900;--accent-soft:#10b4ab1c;--rule:#0b0b1220;--rule-strong:#0b0b125c}
    text{font-family:Avenir Next, Helvetica Neue, sans-serif;fill:#0b0b12}
    .eyebrow,.axis,.edge-label,.meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em;fill:#5f6470}
    .eyebrow{font-size:11px;font-weight:700}.meta{font-size:9px;font-weight:620;letter-spacing:.06em}.axis{font-size:11px;font-weight:650}.edge-label{font-size:10px;font-weight:650}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#5f6470"/></marker><pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0b0b1224" stroke-width=".65"/></pattern></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#paper-grid)" opacity=".44"/>
  <rect x="64" y="44" width="34" height="4" rx="2" fill="#10b4ab"/><rect x="104" y="44" width="12" height="4" rx="2" fill="#f5d900"/>
  <text x="64" y="74" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="32" font-weight="760" letter-spacing="-.03em">Evidence-first recommendation</text>
  <text x="64" y="106" font-size="15" fill="#5f6470">A small operating loop for high-stakes advice</text>
  <text x="1136" y="72" text-anchor="end" class="eyebrow">flow · doc-wide</text>
  <g><path d="M 306.5 224 H 340.5" fill="none" stroke="#5f6470" stroke-width="2" marker-end="url(#arrow)"/></g><g><path d="M 583 224 H 617" fill="none" stroke="#5f6470" stroke-width="2" marker-end="url(#arrow)"/></g><g><path d="M 859.5 224 H 893.5" fill="none" stroke="#5f6470" stroke-width="2" marker-end="url(#arrow)"/><text x="876.5" y="214" text-anchor="middle" class="edge-label">receipt</text></g><g>
    <rect x="64" y="150" width="242.5" height="148" rx="8" fill="#f4f6f5" stroke="#0b0b1266"/>
    <text x="84" y="175" class="eyebrow">01</text>
    <text x="84" y="206" text-anchor="start" font-size="18" font-weight="720" fill="#0b0b12" class=""><tspan x="84" dy="0">Collect context</tspan></text>
    <text x="84" y="252" text-anchor="start" font-size="13" font-weight="450" fill="#5f6470" class=""><tspan x="84" dy="0">Facts, constraints, owner</tspan></text>
  </g><g>
    <rect x="340.5" y="150" width="242.5" height="148" rx="8" fill="#10b4ab16" stroke="#10b4ab"/>
    <text x="360.5" y="175" class="eyebrow">02</text>
    <text x="360.5" y="206" text-anchor="start" font-size="18" font-weight="720" fill="#0b0b12" class=""><tspan x="360.5" dy="0">Choose visual grammar</tspan></text>
    <text x="360.5" y="252" text-anchor="start" font-size="13" font-weight="450" fill="#5f6470" class=""><tspan x="360.5" dy="0">Match the reader&apos;s</tspan><tspan x="360.5" dy="16.25">decision</tspan></text>
  </g><g>
    <rect x="617" y="150" width="242.5" height="148" rx="8" fill="#f4f6f5" stroke="#0b0b1266"/>
    <text x="637" y="175" class="eyebrow">03</text>
    <text x="637" y="206" text-anchor="start" font-size="18" font-weight="720" fill="#0b0b12" class=""><tspan x="637" dy="0">Ground every claim</tspan></text>
    <text x="637" y="252" text-anchor="start" font-size="13" font-weight="450" fill="#5f6470" class=""><tspan x="637" dy="0">Exact source evidence</tspan></text>
  </g><g>
    <rect x="893.5" y="150" width="242.5" height="148" rx="8" fill="#f4f6f5" stroke="#0b0b1266"/>
    <text x="913.5" y="175" class="eyebrow">04</text>
    <text x="913.5" y="206" text-anchor="start" font-size="18" font-weight="720" fill="#0b0b12" class=""><tspan x="913.5" dy="0">Human review</tspan></text>
    <text x="913.5" y="252" text-anchor="start" font-size="13" font-weight="450" fill="#5f6470" class=""><tspan x="913.5" dy="0">Approve, correct, or</tspan><tspan x="913.5" dy="16.25">reject</tspan></text>
  </g>
  <line x1="64" y1="658" x2="1136" y2="658" stroke="#0b0b1224"/>
  <text x="64" y="680" class="eyebrow">Diagrams for Agents Local · private render</text>
  <text x="1136" y="680" text-anchor="end" class="eyebrow">v0.3.0</text>
</svg>