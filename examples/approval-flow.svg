<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrams-for-agents-title diagrams-for-agents-desc" viewBox="0 0 1200 700" width="1200" height="700" data-diagrams-for-agents-family="flow">
  <title id="diagrams-for-agents-title">Evidence-first recommendation</title>
  <desc id="diagrams-for-agents-desc">A small operating loop for high-stakes advice</desc>
  <style>
    :root{--paper:#ffffff;--paper-2:#f4f6f5;--ink:#0b0b12;--muted:#5f6470;--accent:#10b4ab;--accent-2:#f5d900;--accent-soft:#10b4ab1c;--rule:#0b0b1220;--rule-strong:#0b0b125c}
    text{font-family:Avenir Next, Helvetica Neue, sans-serif;fill:#0b0b12}
    .eyebrow,.axis,.edge-label,.meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em;fill:#5f6470}
    .eyebrow{font-size:11px;font-weight:700}.meta{font-size:9px;font-weight:620;letter-spacing:.06em}.axis{font-size:11px;font-weight:650}.edge-label{font-size:10px;font-weight:650}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#5f6470"/></marker><pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0b0b1224" stroke-width=".65"/></pattern></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#paper-grid)" opacity=".44"/>
  <rect x="64" y="44" width="34" height="4" rx="2" fill="#10b4ab"/><rect x="104" y="44" width="12" height="4" rx="2" fill="#f5d900"/>
  <text font-family="Avenir Next, Helvetica Neue, sans-serif" letter-spacing="-.03em" x="64" y="118" text-anchor="start" font-size="32" font-weight="760" fill="#0b0b12" class="diagram-title"><tspan x="64" dy="0">Evidence-first recommendation</tspan></text>
  <text x="64" y="148" text-anchor="start" font-size="15" font-weight="500" fill="#5f6470" class="diagram-subtitle"><tspan x="64" dy="0">A small operating loop for high-stakes advice</tspan></text>
  <text x="1136" y="56" text-anchor="end" class="eyebrow">flow · doc-wide</text>
  <g><path d="M 263 268 H 355" fill="none" stroke="#5f6470" stroke-width="2" marker-end="url(#arrow)"/></g><g><path d="M 554 268 H 646" fill="none" stroke="#5f6470" stroke-width="2" marker-end="url(#arrow)"/></g><g><path d="M 845 268 H 937" fill="none" stroke="#5f6470" stroke-width="2" marker-end="url(#arrow)"/><text x="891" y="258" text-anchor="middle" font-size="9" font-weight="650" fill="#5f6470" class="edge-label"><tspan x="891" dy="0">receipt</tspan></text></g><g>
    <rect x="64" y="194" width="199" height="148" rx="8" fill="#f4f6f5" stroke="#0b0b1266"/>
    <text x="82" y="215" class="eyebrow">01</text>
    <text x="82" y="240" text-anchor="start" font-size="16" font-weight="720" fill="#0b0b12" class=""><tspan x="82" dy="0">Collect context</tspan></text>
    <text x="82" y="327" text-anchor="start" font-size="12" font-weight="450" fill="#5f6470" class=""><tspan x="82" dy="0">Facts, constraints,</tspan><tspan x="82" dy="15">owner</tspan></text>
  </g><g>
    <rect x="355" y="194" width="199" height="148" rx="8" fill="#10b4ab16" stroke="#10b4ab"/>
    <text x="373" y="215" class="eyebrow">02</text>
    <text x="373" y="240" text-anchor="start" font-size="16" font-weight="720" fill="#0b0b12" class=""><tspan x="373" dy="0">Choose visual</tspan><tspan x="373" dy="20">grammar</tspan></text>
    <text x="373" y="327" text-anchor="start" font-size="12" font-weight="450" fill="#5f6470" class=""><tspan x="373" dy="0">Match the reader&apos;s</tspan><tspan x="373" dy="15">decision</tspan></text>
  </g><g>
    <rect x="646" y="194" width="199" height="148" rx="8" fill="#f4f6f5" stroke="#0b0b1266"/>
    <text x="664" y="215" class="eyebrow">03</text>
    <text x="664" y="240" text-anchor="start" font-size="16" font-weight="720" fill="#0b0b12" class=""><tspan x="664" dy="0">Ground every claim</tspan></text>
    <text x="664" y="327" text-anchor="start" font-size="12" font-weight="450" fill="#5f6470" class=""><tspan x="664" dy="0">Exact source evidence</tspan></text>
  </g><g>
    <rect x="937" y="194" width="199" height="148" rx="8" fill="#f4f6f5" stroke="#0b0b1266"/>
    <text x="955" y="215" class="eyebrow">04</text>
    <text x="955" y="240" text-anchor="start" font-size="16" font-weight="720" fill="#0b0b12" class=""><tspan x="955" dy="0">Human review</tspan></text>
    <text x="955" y="327" text-anchor="start" font-size="12" font-weight="450" fill="#5f6470" class=""><tspan x="955" dy="0">Approve, correct, or</tspan><tspan x="955" dy="15">reject</tspan></text>
  </g>
  <line x1="64" y1="658" x2="1136" y2="658" stroke="#0b0b1224"/>
  <text x="64" y="680" class="eyebrow">Diagrams for Agents Local · private render</text>
  <text x="1136" y="680" text-anchor="end" class="eyebrow">v0.3.3</text>
</svg>