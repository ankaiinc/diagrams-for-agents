  <style>
    :root{--paper:#ffffff;--paper-2:#f4f6f5;--ink:#0b0b12;--muted:#5f6470;--accent:#10b4ab;--accent-2:#f5d900;--accent-soft:#10b4ab1c;--rule:#0b0b1220;--rule-strong:#0b0b125c}
