    <rect x="64" y="230" width="194.05" height="124" rx="8" fill="#f4f6f5" stroke="#0b0b1266"/>
    <text x="82" y="251" class="eyebrow">01</text>
    <text x="82" y="277.2" text-anchor="start" style="font-size:16px" font-weight="720" fill="#0b0b12"><tspan x="82" dy="0">Collect context</tspan></text>
    <text x="82" y="298.6" text-anchor="start" style="font-size:12px" font-weight="450" fill="#5f6470"><tspan x="82" dy="0">Facts, constraints,</tspan><tspan x="82" dy="15">owner</tspan></text>
